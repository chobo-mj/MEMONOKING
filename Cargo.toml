[package]
name = "memonoking"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "=0.31.1"
chrono = "0.4"
global-hotkey = "0.7"

arboard = "3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
scraper = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
